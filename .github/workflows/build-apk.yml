name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project (all parts)
        run: |
          for Z in $(ls *.zip | sort); do unzip -q -o "$Z" -d src; done
          P=$(dirname "$(find src -name settings.gradle | head -n 1)")
          echo "PROJ=$P" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          cd "$PROJ"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CyberClaws.apk"
          echo "VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CyberClaws ${{ env.VER }} - APK ${{ github.run_number }}
          files: CyberClaws.apk
